# Add this to your Zigbee2MQTT configuration.yaml under "devices:"
#
# Location: Usually /opt/zigbee2mqtt/data/configuration.yaml
# or in Home Assistant: /config/zigbee2mqtt/configuration.yaml

devices:
  '0x9888e0fffe7fa01c':
    friendly_name: 'two_button_remote'
    # Override the device definition
    definition:
      model: 'TwoBtnRemote'
      vendor: 'DIY'
      description: 'ESP32-C6 two-button Zigbee remote control'

      # Expose battery attributes
      exposes:
        - type: battery
          access: 1  # Read-only
        - type: voltage
          access: 1
          property: voltage
          unit: mV
          value_min: 2500
          value_max: 4200

        # Endpoint 1 - Button 1
        - type: enum
          property: action_ep1
          endpoint: 1
          access: 1
          values:
            - 'toggle'
            - 'brightness_move_up'
            - 'brightness_move_down'
            - 'brightness_stop'
            - 'color_temp_move_up'
            - 'color_temp_move_down'
            - 'color_temp_stop'
          description: 'Button 1 actions (controls Lamp 1 when bound)'

        # Endpoint 2 - Button 2
        - type: enum
          property: action_ep2
          endpoint: 2
          access: 1
          values:
            - 'toggle'
            - 'brightness_move_up'
            - 'brightness_move_down'
            - 'brightness_stop'
            - 'color_temp_move_up'
            - 'color_temp_move_down'
            - 'color_temp_stop'
          description: 'Button 2 actions (controls Lamp 2 when bound)'

        # Endpoint 3 - Both buttons
        - type: enum
          property: action_ep3
          endpoint: 3
          access: 1
          values:
            - 'toggle'
            - 'brightness_move_up'
            - 'brightness_move_down'
            - 'brightness_stop'
            - 'color_temp_move_up'
            - 'color_temp_move_down'
            - 'color_temp_stop'
          description: 'Both buttons pressed (controls Lamp 3 when bound)'
